name: Sync Source to Source-only Mirror (VALORANT)

on:
  push:
    branches: [main]
    paths:
      - 'UnrealEngine/Valorant/Source/**'
      - 'UnrealEngine/Valorant/Config/**'
      - 'UnrealEngine/Valorant/Plugins/**'
      - 'UnrealEngine/Valorant/Valorant.uproject'
      - 'UnrealEngine/Valorant/Tools/**'
      - '.github/workflows/sync-source.yml'
      - 'Doc/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            README.md
            Doc
            UnrealEngine/Valorant/Source
            UnrealEngine/Valorant/Config
            UnrealEngine/Valorant/Plugins
            UnrealEngine/Valorant/Tools
            UnrealEngine/Valorant/Valorant.uproject
          sparse-checkout-cone-mode: false

      - name: Checkout existing source mirror
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.VALORANT_SOURCE_REPO }}
          token: ${{ secrets.VALORANT_SOURCE_PAT }}
          ref: main
          path: out
          fetch-depth: 1

      - name: Prepare mirror workspace
        shell: bash
        run: |
          set -euo pipefail
          for folder in Source Config Tools; do
            rsync -av --delete "UnrealEngine/Valorant/$folder/" "out/$folder/"
          done
          if [ -d "UnrealEngine/Valorant/Plugins" ]; then
            rsync -av --delete --include='*/' --include='*/Source/***' --exclude='*' \
              "UnrealEngine/Valorant/Plugins/" "out/Plugins/"
          fi
          cp "UnrealEngine/Valorant/Valorant.uproject" "out/Valorant.uproject"
          rsync -av --delete "Doc/" "out/Doc/"

          cat > out/README.md <<'MARKDOWN'
          # VALORANT.Source

          기존 VALORANT 팀 프로젝트와 개인 UI 리팩터링의 소스 확인용 미러입니다.
          `Source/`, `Config/`, `Plugins/*/Source`, `Valorant.uproject`, `Tools/`, `Doc/`를 동기화합니다.
          필수 Widget Blueprint와 MatchMap을 포함한 `Content/` 에셋이 없어 이 저장소만으로 전체 게임 실행과 UI 회귀 검증을 수행할 수 없습니다.

          - [전체 프로젝트와 시연](https://github.com/chungheonLee0325/VALORANT)
          - [UI 아키텍처와 주요 코드](https://github.com/chungheonLee0325/VALORANT/blob/main/Doc/UIRefactoring/Architecture.md)
          - [검증 환경과 재현 방법](https://github.com/chungheonLee0325/VALORANT/blob/main/Doc/UIRefactoring/RegressionTests.md)
          - [기술 Wiki](https://github.com/chungheonLee0325/VALORANT/wiki)

          기존 미러 이력을 유지하며 원본 main 변경을 일반 커밋으로 동기화합니다.
          MARKDOWN
          printf '\n원본 커밋 [%s](https://github.com/%s/commit/%s).\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> out/README.md

      - name: Push source mirror
        working-directory: out
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(mirror): sync from $GITHUB_SHA"
          git push origin HEAD:main
